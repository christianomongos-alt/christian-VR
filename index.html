<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Christian VR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script> 
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
</head>
<!-- This is the main body of the website- ALL your content goes AFTER the <body> tag and before the /body tag -->
<body>

<!--enviromnent-->
<a-scene>
    
<a-assets>
    <img id="floor" src="images/floor.jpg" title="image by Daria-Yakovleva from pixabay" prelaod="auto">
    <img id="wall" src="images/wall.jpg" title="image by Michael_Laut from pixabay" prelaod="auto">
    <img id="art1" src="images/car.jpg" preload="auto">
    <img id="art2" src="images/door.png" preload="auto">
   
    
    </a-assets>
<a-entity environment= "preset:egypt; dressingAmount:23;skyColor:#B8336A"></a-entity>
   <!-- Museum floor starts here -->
<a-cylinder id="floor" position="0 0 0" radius="7.5" src="#floor" height="0.1"></a-cylinder>
<a-box id="wall1" position="0 1.473 4.907" rotation="0 0 0" scale="10 3 0.2" src="#wall"></a-box>
<a-box id="wall2" position="0 1.473 -4.907" rotation="0 0 0" scale="10 3 0.2" src="#wall"></a-box>
<a-box id="wall3" position="5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" src="#wall"></a-box>
<a-box id="wall4" position="-5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" src="#wall"></a-box>
<a-box id="wall5" position="-5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" src="#wall"></a-box>
<a-box id="wall6" position="10.91 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" src="#wall"></a-box>
<a-box id="wall7" position="8.066 1.454 4.919" rotation="0 -0.070 0" scale="5.880 1.000 5.00" src="#wall"></a-box>




<!--Roof-->
<a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="black"></a-cylinder>
<a-cylinder id="triangle_back" segments-radial="3" position="0 3.874 -4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="black"></a-cylinder>
<a-box id="roof_right" position="2.580 4.328 0" rotation="28.433 90 0" scale="10.931 0.20 6.110" color="grey"></a-box>
<a-box id="roof_left" position="-2.599 4.321 -0.017" rotation="28.433 -90 0" scale="10.931 0.20 6.130" color="grey"></a-box>

<!--ART-->
<a-plane id="art1" src="#art1" scale="2 2 0.05" rotation="0 0 0" position="-0.162 1.934 -4.792"></a-plane>
<a-plane id="art1" src="#art2" scale="2 2 0.05" rotation="0 0 0" position="-0.162 1.934 -4.792"></a-plane>







</a-scene>
</body>
</html>
